<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Save to litman — Settings</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      max-width: 560px;
      color: #333;
    }
    h1 { font-size: 20px; color: #1565C0; margin-bottom: 20px; }
    h2 { font-size: 14px; color: #555; margin: 16px 0 8px; }
    h3 { font-size: 13px; color: #1565C0; margin: 10px 0 6px; }
    .section { margin-bottom: 20px; padding: 12px; background: #f5f5f5; border-radius: 6px; }
    .lib-block { margin-bottom: 14px; padding: 10px; background: #fff; border: 1px solid #e0e0e0; border-radius: 4px; }
    .lib-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .lib-header span { font-weight: 600; font-size: 14px; }
    .list-item {
      display: flex; align-items: center; gap: 8px;
      padding: 3px 0; font-size: 13px; padding-left: 12px;
    }
    .list-item button, .lib-header button {
      background: none; border: none; color: #c62828;
      cursor: pointer; font-size: 14px;
    }
    .add-row { display: flex; gap: 6px; margin-top: 8px; }
    .add-row input {
      flex: 1; padding: 4px 8px; border: 1px solid #ccc;
      border-radius: 4px; font-size: 13px;
    }
    .add-row button, .btn-add {
      padding: 4px 12px; background: #1565C0; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 13px;
    }
    .folder-add { display: flex; gap: 4px; margin-top: 6px; padding-left: 12px; }
    .folder-add input { flex: 1; padding: 3px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
    .folder-add button { padding: 3px 8px; font-size: 12px; }
    .msg { margin-top: 12px; color: #2e7d32; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Save to litman — Settings</h1>

  <div class="section">
    <h2>Libraries & Folders</h2>
    <div id="lib-list"></div>
    <div class="add-row">
      <input type="text" id="new-lib" placeholder="New library name...">
      <button id="add-lib">Add Library</button>
    </div>
  </div>

  <div class="msg" id="msg"></div>

  <script src="options.js"></script>
</body>
</html>
