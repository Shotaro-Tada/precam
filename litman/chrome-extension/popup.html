<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" alt="litman" class="logo">
    <h1>Save to litman</h1>
  </div>

  <div id="loading" class="status">Detecting DOI...</div>
  <div id="no-doi" class="status" hidden>
    <p>No DOI detected on this page.</p>
    <label>Enter DOI manually:
      <input type="text" id="manual-doi" placeholder="10.1021/acs.xxx">
    </label>
    <button id="manual-fetch" class="btn btn-primary btn-sm">Fetch</button>
  </div>

  <div id="paper-info" hidden>
    <div class="field">
      <label>DOI</label>
      <span id="p-doi"></span>
    </div>
    <div class="field">
      <label>Title</label>
      <span id="p-title"></span>
    </div>
    <div class="field">
      <label>Authors</label>
      <span id="p-authors"></span>
    </div>
    <div class="field">
      <label>Journal</label>
      <span id="p-journal"></span>
    </div>
    <div class="field">
      <label>Year</label>
      <span id="p-year"></span>
    </div>

    <div class="separator"></div>

    <div class="field">
      <label>Library</label>
      <div class="lib-row">
        <select id="library-select"></select>
        <button id="sync-litman" class="btn btn-sm" title="Sync from litman">Sync</button>
      </div>
    </div>
    <div class="field">
      <label>Folder</label>
      <div id="folder-container">
        <input type="text" id="folder-input" list="folder-list" placeholder="Type or select folder...">
        <datalist id="folder-list"></datalist>
      </div>
    </div>

    <div class="actions">
      <button id="save-litman" class="btn btn-primary">Add to litman</button>
      <button id="save-pdf" class="btn btn-secondary">Save PDF</button>
    </div>

    <div id="msg" class="status" hidden></div>
  </div>

  <div class="footer">
    <a href="#" id="open-options">Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
